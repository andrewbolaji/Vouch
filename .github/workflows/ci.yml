name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            test-rules/package-lock.json

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.24.0

      - name: flutter pub get
        run: flutter pub get

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install test-rules dependencies
        run: npm ci
        working-directory: test-rules

      - name: flutter test
        run: flutter test --exclude-tags=golden

      - name: Functions tests against emulators
        run: firebase emulators:exec --only firestore,auth --project vouch-test 'cd functions && npx jest --forceExit'

      - name: Firestore rules tests
        run: npm run test:emulator
        working-directory: test-rules

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
